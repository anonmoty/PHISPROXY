<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in to GitHub</title>
<link rel="icon" href="https://github.githubassets.com/favicons/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;background:#0d1117;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:40px 20px}
.logo{margin-bottom:24px}
.logo svg{width:48px;height:48px;fill:#f0f6fc}
h1{font-size:24px;font-weight:300;color:#f0f6fc;margin-bottom:16px;text-align:center}
.card{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:20px 24px;width:308px}
.card label{display:block;font-size:14px;font-weight:600;color:#f0f6fc;margin-bottom:8px}
.card input{width:100%;padding:8px 12px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#f0f6fc;font-size:14px;outline:none;margin-bottom:16px}
.card input:focus{border-color:#1f6feb;box-shadow:0 0 0 3px rgba(31,111,235,0.3)}
.signin-btn{width:100%;padding:8px;background:#238636;color:white;border:1px solid rgba(240,246,252,0.1);border-radius:6px;font-size:14px;font-weight:500;cursor:pointer}
.signin-btn:hover{background:#2ea043}
.forgot{display:block;text-align:center;color:#58a6ff;font-size:12px;text-decoration:none;margin-top:16px}
.forgot:hover{text-decoration:underline}
.signup{margin-top:16px;padding:16px 24px;border:1px solid #30363d;border-radius:6px;text-align:center;font-size:14px;color:#8b949e;width:308px}
.signup a{color:#58a6ff;text-decoration:none;font-weight:600}
.footer{margin-top:auto;padding:40px 0;text-align:center;font-size:12px;color:#484f58}
.footer a{color:#484f58;text-decoration:none;margin:0 8px}
</style>
</head>
<body>
<div class="logo">
    <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
    </svg>
</div>
<h1>Sign in to GitHub</h1>
<div class="card">
    <form action="/login" method="POST">
        <label>Username or email address</label>
        <input type="text" name="login" required autofocus>
        <label>Password <a href="#" style="color:#58a6ff;font-weight:400;font-size:12px;float:right;text-decoration:none">Forgot password?</a></label>
        <input type="password" name="password" required>
        <button type="submit" class="signin-btn">Sign in</button>
    </form>
</div>
<div class="signup">
    New to GitHub? <a href="#">Create an account</a>.
</div>
<div class="footer">
    <a href="#">Terms</a> · <a href="#">Privacy</a> · <a href="#">Docs</a> · <a href="#">Contact</a>
    <br>© 2024 GitHub, Inc.
</div>
</body>
</html>
